{% extends "base.html" %}

{% block css %}
<style>
  .legal-page {
    background-color: var(--white);
    border: 1px solid var(--lavanda-borde);
    border-radius: var(--radio);
    box-shadow: var(--card-shadow);
    padding: 30px;
    margin-top: 8px;
    margin-bottom: 32px;
    color: var(--text-color);
    line-height: 1.7;
  }

  .legal-page h1 {
    color: var(--text-color);
    font-weight: 800;
    font-size: 1.7rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 0.75rem;
  }

  .legal-page h2 {
    font-size: 1.2rem;
    font-weight: 800;
    margin-top: 2rem;
    margin-bottom: 0.75rem;
  }

  /* subrayados: el color del link es casi el del texto y no se distinguían */
  .legal-page a {
    color: var(--primary-dark);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .legal-page p {
    margin: 0 0 1rem;
  }

  .legal-page ul {
    padding-left: 1.25rem;
  }

  .legal-page li {
    margin-bottom: 0.5rem;
  }

  .legal-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.5rem;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
  }

  .legal-nav a.active {
    font-weight: 700;
    color: var(--text-color);
    text-decoration: none;
    pointer-events: none;
  }

  .legal-updated {
    color: var(--text-light);
    font-size: 0.9rem;
  }

  .legal-note {
    font-size: 0.85rem;
    color: var(--text-light);
    border-top: 1px solid rgba(138, 43, 226, 0.1);
    margin-top: 2rem;
    padding-top: 1rem;
  }

  @media (max-width: 768px) {
    .legal-page {
      padding: 20px 16px;
    }

    .legal-page h1 {
      font-size: 1.45rem;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="col-lg-8 col-md-10 mx-auto legal-page">

      <nav class="legal-nav" aria-label="Páginas legales">
        <a href="/terminos/" {% if legal_page == "terminos" %}class="active" aria-current="page"{% endif %}>Términos y condiciones</a>
        <a href="/privacidad/" {% if legal_page == "privacidad" %}class="active" aria-current="page"{% endif %}>Política de privacidad</a>
      </nav>

      {% block legal %}{% endblock %}

      <p class="legal-updated">Última actualización: 12 de octubre de 2026.</p>

    </div>
  </div>
</div>
{% endblock %}
