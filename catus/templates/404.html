<!DOCTYPE html>
<html lang="es">
<head>
    {% load jentry %}{% jentry_browser %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No encontramos esa página | Catpuccino Adopciones</title>
    <link rel="icon" type="image/png" href="/static/favicon.png" sizes="64x64">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* Página suelta, sin base.html: tiene que poder mostrarse aunque el sitio esté
           roto. Los colores y la letra son los de static/css/modern.css. */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8fd;
            color: #2d3748;
            font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .mensaje {
            box-sizing: border-box;
            width: 100%;
            max-width: 480px;
            margin: 16px;
            padding: 36px 28px;
            background: #fff;
            border: 1px solid #e2d3fa;
            border-radius: 16px;
            box-shadow: 0 1px 2px rgba(45, 26, 77, 0.06), 0 8px 24px rgba(45, 26, 77, 0.07);
            text-align: center;
        }

        .mensaje img {
            width: 200px;
            max-width: 60%;
            height: auto;
        }

        .mensaje h1 {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin: 20px 0 8px;
            text-wrap: balance;
        }

        .mensaje p {
            font-size: 16px;
            line-height: 1.5;
            color: #5d6474;
            margin: 0 0 24px;
        }

        .mensaje p a {
            color: #7020a0;
            font-weight: 700;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .boton {
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            border-radius: 999px;
            padding: 11px 22px;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid #8a2be2;
            background: #8a2be2;
            color: #fff;
        }

        .boton:hover,
        .boton:focus {
            background: #7020a0;
            border-color: #7020a0;
        }

        .boton.secundario {
            background: #fff;
            border-color: #cdbde8;
            color: #2d3748;
        }

        .boton.secundario:hover,
        .boton.secundario:focus {
            background: #f5f0ff;
            border-color: #8a2be2;
        }

        .boton:focus-visible {
            outline: 3px solid rgba(138, 43, 226, 0.45);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main class="mensaje">
        <img src="/static/404.png" alt="">
        <h1>¡Miau! No encontramos esa página</h1>
        <p>Puede que el link esté mal escrito o que la página ya no exista.</p>
        <div class="botones">
            <a class="boton" href="/">Ver animales en adopción</a>
            <button class="boton secundario" type="button" onclick="window.history.back()">Volver</button>
        </div>
    </main>
</body>
</html>
