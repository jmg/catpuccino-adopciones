{% extends "base.html" %}

{% block css %}
{{block.super}}
<style>
    .login-form-container {
        padding: 8px 0 40px;
    }

    #login-box {
        background-color: var(--white);
        border: 1px solid var(--lavanda-borde);
        border-radius: var(--radio);
        box-shadow: var(--card-shadow);
        padding: 32px;
        max-width: 520px;
    }

    .acceso-titulo {
        color: var(--text-color);
        font-weight: 800;
        font-size: 1.6rem;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-align: center;
        margin-bottom: 6px;
    }

    .acceso-bajada {
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
        line-height: 1.45;
        margin: 0 0 24px;
    }

    /* 16px: con menos, el iPhone hace zoom al tocar el campo */
    #login-form .form-control {
        border: 1px solid var(--borde-campo);
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 16px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        background-color: #fff;
    }

    #login-form .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.18);
        outline: none;
    }

    #login-form .form-control.is-invalid {
        border-color: #b3261e;
    }

    /* crispy lo arma como <p><strong>: sin esto hereda los 30px de margen de los párrafos */
    #login-form .invalid-feedback {
        color: #b3261e;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        margin: 6px 0 0;
    }

    #login-form .invalid-feedback p {
        margin: 0 0 4px;
    }

    #login-form .invalid-feedback strong {
        font-weight: 600;
    }

    #login-form .form-group {
        margin-bottom: 20px;
    }

    #login-form label {
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-color);
        font-size: 15px;
    }

    #login-form .form-text {
        color: var(--text-muted) !important;
        font-size: 14px;
        line-height: 1.45;
    }

    #login-form .btn-primary {
        padding: 13px 25px;
        font-size: 16px;
    }

    /* subrayados: por el color solo no se distinguen del texto */
    #login-box a:not(.btn) {
        color: var(--primary-dark);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    #login-box a:not(.btn):hover {
        color: var(--primary-color);
    }

    .acceso-otros {
        border-top: 1px solid var(--lavanda-borde);
        margin-top: 24px;
        padding-top: 18px;
        text-align: center;
        font-size: 15px;
        line-height: 1.9;
    }

    .acceso-error {
        background: #fdecee;
        border: 1px solid #f5c2c7;
        border-radius: 12px;
        color: #7a1c26;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-size: 15px;
        font-weight: 600;
    }

    .acceso-error ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .acceso-aviso {
        text-align: center;
    }

    .acceso-aviso p {
        color: var(--text-color);
        font-size: 16px;
        line-height: 1.55;
        margin: 0 0 18px;
    }

    @media only screen and (max-width: 992px) {
        .login-form-container {
            margin-top: 10px;
            margin-bottom: 30px;
        }

        #login-box {
            padding: 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-form-container">
    <div class="container">
        <div id="login-row" class="row justify-content-center mx-auto">
            <div id="login-box" class="col-md-8 col-lg-6 mx-auto">
            {% block login_content %}
            {% endblock %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
