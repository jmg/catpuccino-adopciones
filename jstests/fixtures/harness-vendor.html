<!doctype html>
<!--
  jQuery, Bootstrap y los plugins que usa el sitio, cargados como en base.html (mismo orden,
  mismos archivos de catus/static) y con un poco de cada cosa que el sitio usa de ellos: la
  barra de navegación (collapse y el desplegable de formularios), las pestañas del panel, un
  modal, un carrusel, el slider de fotos del formulario, alertify y SweetAlert.

  Lo usa vendor.spec.js. Sirve para subir de versión cualquiera de estas librerías: si algo
  deja de andar con la nueva, se ve acá antes que en el sitio.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Librerías del sitio</title>
<link rel="stylesheet" href="/static/css/bootstrap.min.css">
<link rel="stylesheet" href="/static/slider/css/lightslider.min.css">
<style>
  .carousel-item img, #slider img { display: block; width: 300px; height: 150px; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Catpuccino</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
            aria-controls="navbarResponsive" aria-expanded="false" aria-label="Abrir el menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown"
             aria-haspopup="true" aria-expanded="false">Formulario</a>
          <div class="dropdown-menu" aria-labelledby="navbarDropdown">
            <a class="dropdown-item" href="#gatos">Gatos</a>
            <a class="dropdown-item" href="#perros">Perros</a>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main id="contenido">

  <!-- las pestañas del panel (accounts/profile.html) -->
  <ul class="nav nav-tabs" id="profile-tabs" role="tablist">
    <li class="nav-item" role="presentation">
      <a id="animales-tab-link" class="nav-link active" href="#animales" role="tab" data-toggle="tab"
         data-target="#animales-tab" aria-selected="true">Animales</a>
    </li>
    <li class="nav-item" role="presentation">
      <a id="forms-tab-link" class="nav-link" href="#forms" role="tab" data-toggle="tab"
         data-target="#forms-tab" aria-selected="false">Formularios</a>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="animales-tab" role="tabpanel">Animales</div>
    <div class="tab-pane fade" id="forms-tab" role="tabpanel">Formularios</div>
  </div>

  <!-- un carrusel de tarjeta, como los arma index.js -->
  <div id="animalCarrousel-1" class="carousel slide animalCarrousel">
    <div class="carousel-inner">
      <div class="carousel-item active"><img alt="1a" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
      <div class="carousel-item"><img alt="1b" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
    </div>
    <button class="carousel-control-prev" type="button" data-target="#animalCarrousel-1" data-slide="prev">Anterior</button>
    <button class="carousel-control-next" type="button" data-target="#animalCarrousel-1" data-slide="next">Siguiente</button>
  </div>

  <button id="abrir-modal" type="button" class="btn btn-primary" data-toggle="modal" data-target="#modal">Abrir</button>
  <div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-body">Un modal</div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button></div>
      </div>
    </div>
  </div>

  <!-- las fotos del animal en el formulario (adoption/preadoption.html) -->
  <ul id="slider">
    <li><img alt="foto 1" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></li>
    <li><img alt="foto 2" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></li>
  </ul>

</main>

<script src="/static/vendor/jquery/jquery.min.js"></script>
<script src="/static/vendor/bootstrap/js/bootstrap.min.js"></script>
<script src="/static/slider/js/lightslider.min.js"></script>
<script src="/static/js/sweetalert.all.min.js"></script>
<script src="/static/alertify/alertify.min.js"></script>
<script>
  $(".animalCarrousel").carousel({interval: false});
</script>
</body>
</html>
